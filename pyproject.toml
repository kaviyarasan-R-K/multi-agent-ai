[project]
name = "multi-agent-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kaviyarasan-R-K", email = "kavi94779@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "lxml>=6.1.3",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.67.0",
    "tavily-python>=0.8.5",
    "trafilatura>=2.4.0",
]

[project.scripts]
multi-agent-ai = "multi_agent_ai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
